name: Deploy Python static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r code/requirements.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Read deployment domain
        run: echo "SITE_DOMAIN=$(tr -d '\r\n' < content/pages/CNAME)" >> "$GITHUB_ENV"

      - name: Build static site
        run: python code/build.py --fail-on-drafts --site-url "https://${SITE_DOMAIN}" --expected-domain "${SITE_DOMAIN}"

      - name: Validate artifact
        run: python code/check_artifact.py --forbid-drafts --require-cname --expected-domain "${SITE_DOMAIN}" --allow-config-url-mismatch

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
