<script>
  (function() {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.4.0/highlight.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.4.0/languages/actionscript.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js" defer></script>

<script>
    document.addEventListener("DOMContentLoaded", function(){
        // Apply correct hljs theme
        var theme = document.documentElement.getAttribute('data-theme');
        var dark = document.getElementById('hljs-dark-theme');
        var light = document.getElementById('hljs-light-theme');
        if (dark) dark.disabled = (theme === 'light');
        if (light) light.disabled = (theme === 'dark');
        hljs.highlightAll();
        hljs.initLineNumbersOnLoad();
    });
</script>
